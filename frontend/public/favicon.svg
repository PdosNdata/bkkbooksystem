  <line x1="29" y1="12" x2="29" y2="26" stroke="#b91c1c" stroke-width="1"/>
  <line x1="13" y1="36" x2="13" y2="50" stroke="#c2410c" stroke-width="1"/>
  <line x1="31" y1="36" x2="31" y2="50" stroke="#15803d" stroke-width="1"/>
