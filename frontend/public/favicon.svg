  <rect x="8" y="34" width="10" height="18" rx="1" fill="#ea580c"/>
  <rect x="19" y="36" width="7" height="16" rx="1" fill="#2563eb"/>
  <rect x="27" y="34" width="8" height="18" rx="1" fill="#16a34a"/>
  <rect x="36" y="35" width="9" height="17" rx="1" fill="#dc2626"/>
