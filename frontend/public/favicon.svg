<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bookshelf back -->
  <rect x="4" y="8" width="56" height="48" rx="2" fill="#8B5A2B"/>

  <!-- Shelf boards -->
  <rect x="4" y="28" width="56" height="4" fill="#6B4423"/>
  <rect x="4" y="52" width="56" height="4" fill="#6B4423"/>

  <!-- Top shelf books -->
  <rect x="8" y="10" width="8" height="18" rx="1" fill="#2563eb"/>
  <rect x="17" y="12" width="6" height="16" rx="1" fill="#16a34a"/>
  <rect x="24" y="10" width="10" height="18" rx="1" fill="#dc2626"/>
  <rect x="35" y="11" width="7" height="17" rx="1" fill="#eab308"/>
  <rect x="43" y="10" width="8" height="18" rx="1" fill="#7c3aed"/>
